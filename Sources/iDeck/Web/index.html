         No molestar, y macOS 26 no deja activar un modo de concentracion

    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="currentColor"><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(45 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(90 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(135 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(180 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(225 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(270 12 12)"/><rect x="10.75" y="1" width="2.5" height="5.6" rx="1.25" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="7.15" fill="none" stroke="currentColor" stroke-width="3.3"/></symbol>
  </defs>
</svg>

<!-- El fondo. El cristal necesita algo debajo que refractar: sin esto, un
     panel translucido sobre negro plano es solo un gris. Aqui va la portada
     de lo que suena, ampliada y desenfocada, y una malla de color que se
     mueve despacio cuando no hay nada. -->
<div class="ambience" aria-hidden="true">
  <div class="ambience-art" id="ambience-art"></div>
  <div class="ambience-mesh"></div>
  <div class="ambience-veil"></div>
</div>

<div class="app">

  <!-- Barra de estado: reloj, titulo de la pantalla y estado del enlace. -->
  <header class="chrome">
    <span class="chrome-clock" id="clock">--:--</span>
    <div class="chrome-center">
      <!-- "+" a la izquierda del titulo y "−" a la derecha, en Mando y Apps.
           Pequenos y pegados al titulo: no ocupan un hueco de la cuadricula.
           Mientras se quita, los sustituyen Cancelar y Listo. -->
      <button class="chrome-side chrome-add" id="chrome-add" type="button" data-t-aria="add.label">
        <svg aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
      <button class="chrome-word chrome-cancel" id="chrome-cancel" type="button" data-t="edit.cancel">Cancelar</button>
      <h1 class="chrome-title" id="chrome-title" data-t="screen.deck">Mando</h1>
      <button class="chrome-side chrome-remove" id="chrome-remove" type="button" data-t-aria="edit.label">
        <svg aria-hidden="true"><use href="#i-minus"/></svg>
      </button>
      <button class="chrome-word chrome-done" id="chrome-done" type="button" data-t="edit.done">Listo</button>
    </div>
    <button class="chrome-link" id="link" type="button" aria-live="polite">
      <span class="chrome-link-text" id="link-text">Conectando</span>
      <svg class="chrome-link-icon" aria-hidden="true"><use href="#i-wifi"/></svg>
    </button>
  </header>

  <main class="screens" id="screens">

    <!-- Cada panel es una CUADRICULA de celdas cuadradas. Las celdas que no
         caben no se recortan ni se scrollean: pasan a la pagina siguiente,
         que es un hermano aparte y entero. Mientras miras una pagina, las
         demas no estan dibujadas, asi que no asoma nada de la de al lado.

         Las paginas las monta `app.js`: mide el hueco, saca cuantas columnas
         y filas caben de verdad y reparte las piezas. Ver `Grid`. -->

    <!-- Mando. Al estilo de Centro de Control: los dos niveles en pastillas
         de una columna y dos filas, y los circulos rellenando el resto de la
         cuadricula. Ni las apps ni lo que suena viven aqui: cada uno tiene su
         propia pantalla, y una tira que lo unico que hacia era llevarte a
         otra pantalla no es un mando, es un enlace ocupando sitio. -->
    <section class="screen is-active" data-screen="deck" data-t-aria="screen.deck">
      <div class="view"><div class="pages" id="deck"></div></div>
    </section>

    <!-- Apps. Pantalla propia y nada mas: iconos reales del Mac, en la misma
         cuadricula que el Mando. -->
    <section class="screen" data-screen="apps" data-t-aria="screen.apps">
      <div class="view"><div class="pages" id="apps"></div></div>
    </section>

    <!-- Ahora suena. Una sola pagina siempre: la portada se encoge con la
         altura disponible para que quepa con el transporte. -->
    <section class="screen" data-screen="player" data-t-aria="screen.player">
      <div class="view"><div class="pages"><div class="page page--flow is-current">
        <div class="player">
        <div class="player-main">
        <div class="player-art" id="player-art">
          <!-- La misma imagen detras, ampliada y desenfocada: rellena lo que
               le sobra al cuadrado cuando la portada es apaisada, para que
               el dibujo de delante pueda entrar entero sin recortarse. -->
          <img class="player-art-back" id="player-art-back" alt="" aria-hidden="true" draggable="false">
          <img class="player-art-img" id="player-art-img" alt="" draggable="false">
          <!-- Sin portada no se deja el hueco en negro: la inicial de lo que
               suena sobre el color del ambiente, que al menos cambia con el
               contenido. -->
          <div class="player-art-empty">
            <span class="player-art-initial" id="player-art-initial"></span>
            <svg class="player-art-glyph" aria-hidden="true"><use href="#i-music"/></svg>
          </div>
        </div>

        <div class="player-meta">
          <p class="player-source" id="player-source" data-t="player.idle">En espera</p>
          <h2 class="player-title" id="player-title" data-t="player.nothing">Nada suena</h2>
          <p class="player-artist" id="player-artist" data-t="player.hint">Pon algo en el Mac</p>
        </div>

        <!-- La barra se arrastra. Antes solo se pintaba, y de ahi venia que
             no hubiera forma de adelantar el contenido. -->
        <div class="player-progress" id="player-progress" hidden>
          <div class="scrub" id="scrub" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" data-t-aria="player.scrub">
            <div class="scrub-track"><div class="scrub-fill" id="scrub-fill"></div></div>
          </div>
          <div class="progress-times">
            <span id="progress-elapsed">0:00</span>
            <span id="progress-left">-0:00</span>
          </div>
        </div>

        <!-- Los cinco botones existen siempre; se ensena la pareja que
             corresponde al tipo de reproductor. Un video de un navegador
             lleva ±10 s, una cancion anterior/siguiente. -->
        <div class="player-keys" id="player-keys" role="group" data-t-aria="player.transport">
          <button class="key key-seek" type="button" data-action="media.seek" data-value="-10" data-t-aria="player.back10">
            <svg aria-hidden="true"><use href="#i-back10"/></svg>
          </button>
          <button class="key key-skip" type="button" data-action="media.previous" data-t-aria="player.prev">
            <svg aria-hidden="true"><use href="#i-prev"/></svg>
          </button>
          <button class="key key-main" type="button" data-action="media.playpause" id="playpause" data-t-aria="player.play">
            <svg class="key-glyph is-play" aria-hidden="true"><use href="#i-play"/></svg>
            <svg class="key-glyph is-pause" aria-hidden="true"><use href="#i-pause"/></svg>
          </button>
          <button class="key key-skip" type="button" data-action="media.next" data-t-aria="player.next">
            <svg aria-hidden="true"><use href="#i-next"/></svg>
          </button>
          <button class="key key-seek" type="button" data-action="media.seek" data-value="10" data-t-aria="player.fwd10">
            <svg aria-hidden="true"><use href="#i-fwd10"/></svg>
          </button>
        </div>
        </div>

        <!-- El volumen, en vertical y pegado al borde derecho: es el unico
             nivel que se toca mientras suena algo, y en horizontal la mano
             derecha ya esta ahi. -->
        <div class="player-volume" id="player-volume"></div>
        </div>
      </div></div></div>
    </section>

    <!-- Ajustes: solo lo que tiene sentido tocar desde el movil. El resto
         vive en la ventana de ajustes del Mac. Aqui las piezas no son celdas
         sino grupos de filas, asi que la pagina corta entre grupos. -->
    <section class="screen" data-screen="settings" data-t-aria="screen.settings">
      <div class="view"><div class="pages" id="settings"></div></div>
    </section>

  </main>

  <!-- Dock. Solo iconos: una etiqueta debajo de un glifo de 26 px no anade
       nada y rompe la proporcion. Abajo en el movil, columna entera a la
       izquierda en pantalla ancha. -->
  <nav class="dock glass" id="dock" data-t-aria="screen.deck">
    <button class="tab is-active" type="button" data-screen="deck" aria-current="page" data-t-aria="screen.deck">
      <svg aria-hidden="true"><use href="#i-controls"/></svg>
    </button>
    <button class="tab" type="button" data-screen="apps" data-t-aria="screen.apps">
      <svg aria-hidden="true"><use href="#i-deck"/></svg>
    </button>
    <button class="tab" type="button" data-screen="player" data-t-aria="screen.player">
      <svg aria-hidden="true"><use href="#i-waveform"/></svg>
    </button>
    <button class="tab" type="button" data-screen="settings" data-t-aria="screen.settings">
      <svg aria-hidden="true"><use href="#i-gear"/></svg>
    </button>
  </nav>
</div>

<!-- Invitacion a la pantalla de inicio. Sale UNA vez, y solo si el panel se
     abre en una pestana: en el navegador no hay forma de quitar las barras,
     desde el icono si. -->
<div class="sheet-host install-host" id="install-host" hidden>
  <div class="sheet-scrim"></div>
  <div class="sheet install glass" role="dialog" aria-modal="true" aria-labelledby="install-title">
    <div class="install-head">
      <img class="install-icon" src="icon.svg" alt="">
      <h2 class="sheet-title" id="install-title" data-t="install.title">Ponlo en la pantalla de inicio</h2>
      <p class="sheet-body" data-t="install.body">Así se abre a pantalla completa, sin barras del navegador.</p>
    </div>
    <ol class="install-steps">
      <li><span class="install-glyph"><svg aria-hidden="true"><use href="#i-share"/></svg></span><span id="install-step-1" data-t="install.step1.ios">Pulsa Compartir</span></li>
      <li><span class="install-glyph"><svg aria-hidden="true"><use href="#i-add-square"/></svg></span><span id="install-step-2" data-t="install.step2.ios">Elige «Añadir a pantalla de inicio»</span></li>
      <li><span class="install-glyph"><img src="icon.svg" alt=""></span><span data-t="install.step3">Ábrelo desde el icono</span></li>
    </ol>
    <div class="sheet-actions install-actions">
      <button class="sheet-button" type="button" id="install-dismiss" data-t="install.dismiss">Seguir en el navegador</button>
    </div>
  </div>
</div>

<!-- Selector del "+": apps del Mac o mandos que faltan. Una cuadricula
     paginada como los paneles: nada scrollea, tampoco aqui. -->
<div class="sheet-host picker-host" id="picker-host" hidden>
  <div class="sheet-scrim" id="picker-scrim"></div>
  <div class="sheet picker glass" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 class="sheet-title" id="picker-title"></h2>
      <button class="picker-done" type="button" id="picker-done" data-t="add.done">Listo</button>
    </div>
    <div class="picker-body" id="picker-body"></div>
    <div class="picker-dots" id="picker-dots" aria-hidden="true"></div>
  </div>
</div>

<!-- Hoja de confirmacion, al estilo de las alertas de iOS. -->
<div class="sheet-host" id="sheet-host" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-icon" id="sheet-icon"><svg aria-hidden="true"><use href="#i-warning"/></svg></div>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <p class="sheet-body" id="sheet-body"></p>
    <div class="sheet-actions">
      <button class="sheet-button" type="button" id="sheet-confirm" data-t="sheet.ok">Continuar</button>
      <button class="sheet-button" type="button" id="sheet-cancel" data-t="sheet.cancel">Cancelar</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
