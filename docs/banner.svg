<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowAmber" cx="26%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSlate" cx="80%" cy="76%" r="60%">
      <stop offset="0%" stop-color="#8fa3b0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8fa3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe2b8"/>
    </linearGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#11161a"/>
  <rect width="1200" height="320" fill="url(#glowAmber)"/>
  <rect width="1200" height="320" fill="url(#glowSlate)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="107" x2="1200" y2="107"/>
    <line x1="0" y1="214" x2="1200" y2="214"/>
  </g>

  <!-- El icono de la app (Sources/iDeck/Web/icon.svg) a la izquierda y el
       nombre en grande a la derecha, el conjunto centrado. -->
  <g filter="url(#iconShadow)">
    <svg x="372" y="84" width="152" height="152" viewBox="0 0 180 180">
      <rect width="180" height="180" rx="40" fill="#1A2024"/>
      <rect width="180" height="180" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
      <g fill="#3C474E">
        <rect x="34" y="34" width="32" height="32" rx="7"/>
        <rect x="74" y="34" width="32" height="32" rx="7"/>
        <rect x="114" y="34" width="32" height="32" rx="7"/>
        <rect x="34" y="74" width="32" height="32" rx="7"/>
        <rect x="114" y="74" width="32" height="32" rx="7"/>
        <rect x="34" y="114" width="32" height="32" rx="7"/>
        <rect x="74" y="114" width="32" height="32" rx="7"/>
        <rect x="114" y="114" width="32" height="32" rx="7"/>
      </g>
      <rect x="74" y="74" width="32" height="32" rx="7" fill="#E8A33D"/>
    </svg>
  </g>

  <text x="564" y="160" dominant-baseline="central"
        font-family="ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="124" font-weight="700" letter-spacing="-1.5"
        fill="url(#textFade)">iDeck</text>
</svg>
